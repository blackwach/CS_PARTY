name: CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cs2-stats-service/package-lock.json

      - name: Setup virtual environment
        run: |
          python3 -m venv venv
          echo "VIRTUAL_ENV=${PWD}/venv" >> $GITHUB_ENV
          echo "${PWD}/venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare env for checks
        run: cp .env.example .env

      - name: Django checks
        run: python manage.py check

      - name: Validate allocator syntax
        run: python3 -m py_compile ../cs2-server-allocator/app.py

      - name: Validate stats bot syntax
        run: node --check ../cs2-stats-service/server.js

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    needs: test
    concurrency:
      group: cs-party-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare backend env
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.BACKEND_ENV_FILE }}" ]; then
            printf "%s" "${{ secrets.BACKEND_ENV_FILE }}" > backend/.env
          elif [ -r /opt/cs-party-secrets/backend.env ]; then
            cp /opt/cs-party-secrets/backend.env backend/.env
          elif [ -r "$HOME/cs-party-secrets/backend.env" ]; then
            cp "$HOME/cs-party-secrets/backend.env" backend/.env
          else
            echo "No env source found. Set BACKEND_ENV_FILE or provide a readable backend.env file."
            exit 1
          fi

      - name: Clean up old containers
        run: |
          docker compose down --remove-orphans || true
          docker system prune -f

      - name: Build and deploy
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Show running services
        run: docker compose ps

      - name: Verify required services are running
        shell: bash
        run: |
          set -euo pipefail
          required_services=(backend celery_worker celery_beat frontend db redis cs2_stats_service)
          running_services="$(docker compose ps --services --status running)"
          for service in "${required_services[@]}"; do
            if ! grep -qx "$service" <<< "$running_services"; then
              echo "Required service is not running: $service"
              docker compose ps
              exit 1
            fi
          done

      - name: Verify CS2 stats service health from backend network
        run: |
          docker compose exec -T backend python -c "import requests, sys; r = requests.get('http://cs2_stats_service:3100/health', timeout=10); print(r.status_code); print(r.text[:500]); sys.exit(0 if r.ok else 1)"

      - name: Verify deployment
        run: |
          echo "Deployment completed at $(date)"
          echo "Services status:"
          docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"

  # Optional job. Enable by setting repository variable DEPLOY_ALLOCATOR=true.
  deploy-cs2-allocator:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ALLOCATOR == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    needs: test
    concurrency:
      group: cs-party-allocator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare allocator env
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ALLOCATOR_ENV_FILE }}" ]; then
            printf "%s" "${{ secrets.ALLOCATOR_ENV_FILE }}" > infra/cs2-allocator/.env
          elif [ -r /opt/cs-party-secrets/allocator.env ]; then
            cp /opt/cs-party-secrets/allocator.env infra/cs2-allocator/.env
          elif [ -r "$HOME/cs-party-secrets/allocator.env" ]; then
            cp "$HOME/cs-party-secrets/allocator.env" infra/cs2-allocator/.env
          else
            echo "No env source found. Set ALLOCATOR_ENV_FILE or provide allocator.env on runner."
            exit 1
          fi

      - name: Deploy allocator locally
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/cs2-allocator/docker-compose.yml --env-file infra/cs2-allocator/.env down --remove-orphans || true
          docker compose -f infra/cs2-allocator/docker-compose.yml --env-file infra/cs2-allocator/.env up -d --build --remove-orphans
          docker compose -f infra/cs2-allocator/docker-compose.yml --env-file infra/cs2-allocator/.env ps

      - name: Verify allocator health
        shell: bash
        run: |
          set -euo pipefail
          ALLOCATOR_URL="$(grep -E '^ALLOCATOR_PUBLIC_URL=' infra/cs2-allocator/.env | head -n1 | cut -d '=' -f2-)"
          if [ -z "$ALLOCATOR_URL" ]; then
            ALLOCATOR_URL="http://127.0.0.1:8090"
          fi
          curl --fail --show-error --silent "$ALLOCATOR_URL/health"
