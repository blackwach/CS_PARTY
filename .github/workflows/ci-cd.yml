name: CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup virtual environment
        run: |
          python3 -m venv venv
          echo "VIRTUAL_ENV=${PWD}/venv" >> $GITHUB_ENV
          echo "${PWD}/venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare env for checks
        run: cp .env.example .env

      - name: Django checks
        run: python manage.py check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    needs: test
    concurrency:
      group: cs-party-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare backend env
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.BACKEND_ENV_FILE }}" ]; then
            printf "%s" "${{ secrets.BACKEND_ENV_FILE }}" > backend/.env
          elif [ -r /opt/cs-party-secrets/backend.env ]; then
            cp /opt/cs-party-secrets/backend.env backend/.env
          elif [ -r "$HOME/cs-party-secrets/backend.env" ]; then
            cp "$HOME/cs-party-secrets/backend.env" backend/.env
          else
            echo "No env source found. Set BACKEND_ENV_FILE or provide a readable backend.env file."
            exit 1
          fi

      - name: Clean up old containers
        run: |
          docker compose down --remove-orphans || true
          docker system prune -f

      - name: Build and deploy
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Show running services
        run: docker compose ps

      - name: Verify required services are running
        shell: bash
        run: |
          set -euo pipefail
          required_services=(backend celery_worker celery_beat frontend db redis)
          running_services="$(docker compose ps --services --status running)"
          for service in "${required_services[@]}"; do
            if ! grep -qx "$service" <<< "$running_services"; then
              echo "Required service is not running: $service"
              docker compose ps
              exit 1
            fi
          done

      - name: Verify deployment
        run: |
          echo "Deployment completed at $(date)"
          echo "Services status:"
          docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
