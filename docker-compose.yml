version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cs_party}
      POSTGRES_USER: ${POSTGRES_USER:-cs_party}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_party}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs_party} -d ${POSTGRES_DB:-cs_party}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cs_party_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - cs_party_net

  cs2_stats_service:
    build:
      context: ./cs2-stats-service
    image: cs-party-cs2-stats-service:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3100
    networks:
      - cs_party_net

  cs2_server_allocator:
    build:
      context: ./cs2-server-allocator
    image: cs-party-cs2-server-allocator:latest
    restart: unless-stopped
    profiles:
      - allocator-local
    environment:
      PORT: 8090
      CS2_PUBLIC_HOST: ${CS2_PUBLIC_HOST:-127.0.0.1}
      CS2_IMAGE: ${CS2_IMAGE:-joedwards32/cs2:latest}
      CS2_PORT_RANGE_START: ${CS2_PORT_RANGE_START:-27100}
      CS2_PORT_RANGE_END: ${CS2_PORT_RANGE_END:-27200}
      CS2_REQUIRE_X86: ${CS2_REQUIRE_X86:-true}
      CS2_SERVER_PASSWORD: ${CS2_SERVER_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cs_party_net

  backend:
    build:
      context: ./backend
    image: cs-party-backend:latest
    restart: unless-stopped
    command: gunicorn config.asgi:application --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4
    env_file:
      - ./backend/.env
    environment:
      RUN_DB_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CHANNEL_REDIS_URL: ${CHANNEL_REDIS_URL:-redis://redis:6379/1}
      CS2_STATS_API_URL: ${CS2_STATS_API_URL:-http://cs2_stats_service:3100}
      CS2_STATS_API_TOKEN: ${CS2_STATS_API_TOKEN:-}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      cs2_stats_service:
        condition: service_started
    networks:
      - cs_party_net

  celery_worker:
    build:
      context: ./backend
    image: cs-party-backend:latest
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - ./backend/.env
    environment:
      RUN_DB_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CS2_STATS_API_URL: ${CS2_STATS_API_URL:-http://cs2_stats_service:3100}
      CS2_STATS_API_TOKEN: ${CS2_STATS_API_TOKEN:-}
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
      cs2_stats_service:
        condition: service_started
    networks:
      - cs_party_net

  celery_beat:
    build:
      context: ./backend
    image: cs-party-backend:latest
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - ./backend/.env
    environment:
      RUN_DB_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CS2_STATS_API_URL: ${CS2_STATS_API_URL:-http://cs2_stats_service:3100}
      CS2_STATS_API_TOKEN: ${CS2_STATS_API_TOKEN:-}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
      cs2_stats_service:
        condition: service_started
    networks:
      - cs_party_net

  telegram_bot:
    build:
      context: ./backend
    image: cs-party-backend:latest
    restart: unless-stopped
    command: python manage.py run_telegram_bot
    env_file:
      - ./backend/.env
    environment:
      RUN_DB_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      backend:
        condition: service_started
    networks:
      - cs_party_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    image: cs-party-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-8080}:80"
    volumes:
      - static_data:/static:ro
      - media_data:/media:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - cs_party_net

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  cs_party_net:
    driver: bridge
