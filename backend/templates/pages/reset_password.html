{% extends "pages/base.html" %}

{% block title %}Reset Password | CS Party{% endblock %}

{% block content %}
<section class="hero">
    <h1>Password reset</h1>
    <p>Enter a new password. Reset token from your e-mail is read automatically from URL.</p>
    <div class="card" style="margin-top:16px; max-width:560px;">
        <form id="reset-form">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" required minlength="8" style="display:block;width:100%;padding:10px;margin:8px 0 12px;border-radius:8px;border:1px solid #315071;background:#0b1c2d;color:#fff;">
            <button class="btn" type="submit">Update password</button>
        </form>
        <p id="result" style="margin-top:12px;color:#b6c8da;"></p>
    </div>
</section>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const form = document.getElementById('reset-form');
const result = document.getElementById('result');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const newPassword = document.getElementById('password').value;

  if (!token) {
    result.textContent = 'Token was not found in URL.';
    return;
  }

  const response = await fetch('/api/auth/password-reset/confirm/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, new_password: newPassword })
  });

  const data = await response.json();
  result.textContent = data.message || data.detail || JSON.stringify(data);
});
</script>
{% endblock %}
